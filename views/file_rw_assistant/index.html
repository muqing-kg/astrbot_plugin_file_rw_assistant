<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文件读写小助手</title>
  <link rel="stylesheet" href="./styles.css?v=1.7.1" />
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div>
        <h1>文件读写小助手</h1>
        <p class="sub">聊天里的文件自动存到这里，可读、可改、可生成、可发回；每个文件都有版本历史。</p>
      </div>
      <div class="head-actions">
        <span class="chip" id="stat">—</span>
        <button class="ghost" id="refresh" type="button">刷新</button>
        <button id="pick" type="button">上传</button>
        <input id="file" type="file" multiple hidden />
      </div>
    </header>

    <div class="toolbar">
      <input id="q" type="search" placeholder="搜文件名或备注" />
      <span class="hint" id="up-hint"></span>
    </div>

    <div class="kinds" id="kinds"></div>

    <section class="card" id="card">
      <table class="files" id="table">
        <thead>
          <tr>
            <th>名称</th><th>类型</th><th>大小</th><th>版本</th><th>更新时间</th><th class="actions-col"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="empty" hidden>
        <p class="empty-title">这一类里还没有文件</p>
        <p class="empty-hint">在聊天里发一份文件，或者点右上角上传、直接把文件拖到这个框里。</p>
      </div>
    </section>

    <section class="card viewer" id="viewer" hidden>
      <div class="viewer-head">
        <strong id="v-name"></strong>
        <div class="viewer-actions">
          <select id="v-version"></select>
          <button class="ghost" id="v-download" type="button">下载</button>
          <button class="ghost" id="v-close" type="button">关闭</button>
        </div>
      </div>
      <p class="hint" id="v-meta"></p>
      <textarea id="v-text" spellcheck="false" readonly></textarea>
    </section>
  </main>
  <script src="./app.js?v=1.7.1"></script>
</body>
</html>
