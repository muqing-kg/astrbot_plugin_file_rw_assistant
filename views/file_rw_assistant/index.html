<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文件读写小助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="tabs">
      <button class="tab active" data-tab="files">文件</button>
      <button class="tab" data-tab="settings">设置</button>
    </div>
    <div class="stat" id="stat"></div>
  </header>

  <main class="view" id="view-files">
    <aside class="rail" id="rail"></aside>
    <section class="tablewrap">
      <div class="row-tools">
        <input id="q" type="search" placeholder="搜文件名" />
        <button class="ghost" id="refresh">刷新</button>
        <button class="btn primary" id="pick">上传</button>
        <input id="file" type="file" hidden />
        <span class="hint" id="up-hint"></span>
      </div>
      <div class="tablehost">
        <table id="table">
          <thead>
            <tr><th>名称</th><th>类型</th><th>大小</th><th>版本</th><th>来源</th><th>更新时间</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <p class="empty" id="empty" hidden>这个类型下还没有文件。</p>
      </div>
    </section>
    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-head">
        <strong id="d-name"></strong>
        <button class="ghost" id="d-close">关闭</button>
      </div>
      <div class="drawer-actions">
        <a class="btn" id="d-download" href="#" download>下载</a>
        <button class="btn" id="d-send">发到会话</button>
        <button class="btn danger" id="d-delete">删除</button>
      </div>
      <section class="pane">
        <h4>内容</h4>
        <textarea id="d-content" spellcheck="false"></textarea>
        <div class="pane-foot">
          <span class="hint" id="d-hint"></span>
          <button class="btn primary" id="d-save" disabled>存为新版本</button>
        </div>
      </section>
      <section class="pane">
        <h4>版本历史</h4>
        <ul class="versions" id="d-versions"></ul>
      </section>
    </aside>
  </main>

  <main class="view" id="view-settings" hidden>
    <section class="settings" id="settings"></section>
    <div class="pane-foot">
      <span class="hint">改完点保存，插件配置页与这里读写同一份。</span>
      <button class="btn primary" id="s-save">保存设置</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
